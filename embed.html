<!-- Vložení landing page na skvelecesko.cz/firmy (do zdrojového kódu podstránky) -->
<iframe id="sclp-frame" src="https://marekkrumal.github.io/skvelecesko-firmy/" title="Firemní vouchery SkvěléČesko"
        style="width:100%;height:max(7800px, calc(15700px - 1450vw));border:0;display:block" loading="lazy"></iframe>
<script>
  // výška podle obsahu (když editor script nesmaže); jinak zůstane pevných 7100 px
  window.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'sclp-height') document.getElementById('sclp-frame').style.height = e.data.height + 'px';
  });
</script>
